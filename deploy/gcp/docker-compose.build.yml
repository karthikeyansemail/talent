# =============================================================================
# Nalam Pulse — GCP Build-on-VM Docker Compose
# Builds images locally from source. Used by install.sh.
# =============================================================================

x-app-env: &app-env
  APP_NAME: "${APP_NAME:-Nalam Pulse}"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY}"
  APP_URL: "${APP_URL}"
  DB_CONNECTION: mysql
  DB_HOST: db
  DB_PORT: 3306
  DB_DATABASE: talent_db
  DB_USERNAME: talent
  DB_PASSWORD: "${DB_PASSWORD}"
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: database
  MAIL_MAILER: "${MAIL_MAILER:-log}"
  MAIL_HOST: "${MAIL_HOST}"
  MAIL_PORT: "${MAIL_PORT:-587}"
  MAIL_USERNAME: "${MAIL_USERNAME}"
  MAIL_PASSWORD: "${MAIL_PASSWORD}"
  MAIL_ENCRYPTION: tls
  MAIL_FROM_ADDRESS: "${MAIL_FROM_ADDRESS:-noreply@nalampulse.com}"
  MAIL_FROM_NAME: "Nalam Pulse"
  AI_SERVICE_URL: "http://ai-service:8000"

services:

  app:
    build:
      context: ../..
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      <<: *app-env
    volumes:
      - app-storage:/var/www/html/storage/app/public
      - ${ENV_FILE:-../../deploy/gcp/.env}:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_started
    networks:
      - internal

  queue-worker:
    build:
      context: ../..
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    entrypoint: []
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    environment:
      <<: *app-env
    volumes:
      - ${ENV_FILE:-../../deploy/gcp/.env}:/var/www/html/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  ai-service:
    build:
      context: ../../ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../ai-service/.env
    networks:
      - internal

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      MYSQL_DATABASE: talent_db
      MYSQL_USER: talent
      MYSQL_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - internal

volumes:
  db-data:
  app-storage:

networks:
  internal:
    driver: bridge
